name: Weekly YouTube refresh

on:
  schedule:
    # 09:00 every Monday in China Standard Time (UTC+8).
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest YouTube entries
        run: python .github/scripts/weekly_update.py
        env:
          # Optional: adds exact duration and current view counts.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly.json
          git diff --cached --quiet || git commit -m "chore: weekly YouTube refresh"
          git push

