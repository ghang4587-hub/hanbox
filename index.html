  IBre8BkmhVk:{ten:'画面：女主在地下训练场接受最后测试，教官不断加码，逼她亮出异常能力。｜吸睛点：高压测试一开场就制造危险，并埋下她为何被训练的悬念。',story:'教官把女主训练成杀人武器，却发现她最终要杀的目标正是自己。两人必须查清是谁安排了这场训练，以及女主真正的来历。'},
  NlUsfduAyIs:{ten:'画面：丈夫带律师逼女主签离婚协议，她却突然听见婆婆和小三的心里话。｜吸睛点：女主先被围攻，再瞬间拿到所有人的秘密。',story:'女主准备签离婚协议时突然获得读心能力。她发现丈夫一家都在骗她、算计她的财产，于是停笔并开始反击。'},

  o6f7SYasH24:{ten:'画面：婚礼仪式突然被打断，未婚夫的父亲当众带走新娘，并说她不能嫁给自己的儿子。｜吸睛点：抢婚者竟是准公公，关系冲突非常反常。',story:'女主的婚礼被未婚夫父亲强行打断。她被带进这个家族后才发现，对方隐藏着龙族身份，婚约背后另有安排。'},
  fMthQGE3bc4:{ten:'画面：女主当场撞见丈夫出轨，丈夫还认定她不敢离开；她一句解释都没有，转身收拾东西。｜吸睛点：受辱后不哭闹，平静离开反而让人期待后续打脸。',story:'丈夫长期出轨，还以为女主离不开自己。女主彻底离开后收回资源、重新生活，丈夫才发现真正失去的是自己。'},
  KAO12oBVrCU:{ten:'画面：男主救下受伤的小精灵，旁人嘲笑他多管闲事；精灵王随后带人向他行礼。｜吸睛点：不起眼的善举立刻换来王者级回报。',story:'男主顺手救了一个被欺负的小精灵。后来他遇到危险，精灵王亲自来救，并让所有看不起他的人改变态度。'},
  __v9vtpNJCY:{ten:'画面：女主见到丈夫的女儿时，孩子突然抱住她喊妈妈，一个熟悉的胎记也露了出来。｜吸睛点：一句称呼就触发认亲，心疼和悬念同时出现。',story:'女主发现丈夫的女儿可能是自己失踪多年的孩子。她一边追查孩子身世，一边发现身边的黑帮老大也知道当年的真相。'},
  UndefzC_VTM:{ten:'画面：女主被一群人围住追捕，所有人都把她当猎物；她亮出真正身份后，对方开始叫她女王。｜吸睛点：猎物和掌权者在同一场戏里翻转。',story:'女主起初被人追捕和利用，所有人都以为她没有还手能力。她拿到关键筹码后反过来掌权，让追杀自己的人臣服。'},
  oFl6yiRrTcE:{ten:'画面：女主刚嫁入豪门，就被告知丈夫身上有致命诅咒，靠近他的妻子也可能会死。｜吸睛点：甜蜜新婚瞬间变成生死规则。',story:'女主嫁给亿万富豪后，发现丈夫和整个家族都受诅咒控制。她必须在被诅咒害死前找出原因和破解办法。'},
  PXIaxYkekNs:{ten:'画面：末日里所有人正抢一口食物，男主投下一枚硬币，系统立刻给他成倍资源。｜吸睛点：一枚硬币换来统治级能力，资源反差一眼就懂。',story:'末日中大家都在为食物拼命，男主却用一枚硬币激活系统，获得大量资源和能力。他靠这个优势活下来并建立自己的势力。'},
  Zt8fAC503dY:{ten:'画面：反派把小孩当成累赘抓走她的母亲，小孩抬手便爆发出远超成年英雄的力量。｜吸睛点：最弱外表配最强能力，反差马上成立。',story:'世界最强英雄一直伪装成普通孩子。母亲遇险后，她不再隐藏力量，独自追击敌人并把妈妈带回家。'},
  'Q-cY5r51LFk':{ten:'画面：孩子当着亲妈的面选择有钱的养父母，亲妈最后一次求助也被他挂断。｜吸睛点：错误选择立刻造成无法挽回的后果。',story:'孩子嫌亲妈贫穷，选择跟有钱人生活，也错过了母亲最后的求救。失去母亲后，他才知道金钱替代不了真正爱他的人。'},
  a0sqkFpCwME:{ten:'画面：所有人都略过不起眼的男主，三位强势女性却接连走向他，公开表示只选他。｜吸睛点：从无人理会到被三人争抢，地位连续翻升。',story:'男主一直被当成没有本事的普通人。三位优秀女性却同时看中他，也让众人开始怀疑他隐藏着真正身份。'},

  AWPiQIAxiCE:{ten:'画面：外面的人为半块面包争斗，女主打开储藏室，里面的食物却怎么拿都拿不完。｜吸睛点：极端饥荒和无限食物形成最直观的资源差。',story:'饥荒中所有人都缺少食物，只有女主拥有无限物资。她必须隐藏这个秘密，同时防住想抢走资源的人。'},
  sn2jlHSWjlQ:{ten:'画面：女主用假身份参加豪门场合，两位亿万富豪同时认出她，却都把她当成另一个人。｜吸睛点：双男主争抢叠加身份随时暴露。',story:'女主伪造身份接近两个亿万富豪，本想完成自己的计划，却成了两家争抢的人。她必须在身份曝光前达成目的。'},
  sWlKTGl4oeM:{ten:'画面：前任刚当众抛弃女主，亿万富豪就走到她身边，公开表示自己选择她。｜吸睛点：被踩低和被更强者认可紧挨着发生。',story:'女主被恋人背叛后，转身得到亿万富豪的帮助和认可。她重新站稳脚跟，也让抛弃她的前任开始后悔。'},
  u8rVNOnaBBg:{ten:'画面：男主忙着追查过去，连续挂断母亲来电；下一通电话却通知他母亲已经去世。｜吸睛点：一个挂断动作马上变成永远无法补救的遗憾。',story:'男主执着追查自己的过去，多次忽略母亲的求救。母亲去世后，他才发现自己追逐的真相让他失去了最重要的人。'},

function paintStoryboardFrames(){
  document.querySelectorAll('#timeline .storyboard-canvas').forEach(canvas=>{
    if(canvas.dataset.state)return;canvas.dataset.state='loading';
    loadStoryboardImage(canvas.dataset.src).then(image=>{
      const context=canvas.getContext('2d'),sx=Number(canvas.dataset.sx),sy=Number(canvas.dataset.sy),sw=Number(canvas.dataset.sw),sh=Number(canvas.dataset.sh),cw=canvas.width,ch=canvas.height;
      const fillScale=Math.max(cw/sw,ch/sh),fillWidth=sw*fillScale,fillHeight=sh*fillScale;
      context.filter='blur(16px) brightness(.56)';
      context.drawImage(image,sx,sy,sw,sh,(cw-fillWidth)/2,(ch-fillHeight)/2,fillWidth,fillHeight);
      context.filter='none';
      const fitScale=Math.min(cw/sw,ch/sh),fitWidth=sw*fitScale,fitHeight=sh*fitScale;
      context.drawImage(image,sx,sy,sw,sh,(cw-fitWidth)/2,(ch-fitHeight)/2,fitWidth,fitHeight);
      canvas.dataset.state='ready'
    }).catch(()=>{canvas.dataset.state='fallback'})
  })
}
function genericMomentsFor(x){
  return [['00:00',hookFor(x)],['00:58','冲突升级，隐藏关系或真实目的被揭开。'],['01:46','对立双方被迫正面交锋，情绪开始翻面。'],['02:43','新线索出现，留下下一集悬念。']]
}
function open(i){
  const x=data[i],f=flowFor(x);
  document.getElementById('mTitle').textContent=x.t;
  player(`https://www.youtube.com/watch?v=${x.id}`,document.getElementById('mPlayer'));
  document.getElementById('mCover').innerHTML=`<img src="https://i.ytimg.com/vi/${x.id}/hqdefault.jpg" alt="${x.t} 封面"><b>${x.t}</b>`;
  document.getElementById('mMeta').innerHTML=`<span>${x.c}</span><span class="dot"></span><span>总时长 ${fmt(x.d)}</span><span class="dot"></span><span>${x.g.join(' · ')}</span><span class="dot"></span><a href="https://www.youtube.com/watch?v=${x.id}" target="_blank" style="color:var(--blue)">YouTube 原片 ↗</a>`;
  const moments=(Array.isArray(x.m)&&x.m.length?x.m:genericMomentsFor(x)).map((z,index)=>index===0?[z[0],hookFor(x)]:z);
  const describedFrames=moments.map((z,index)=>{const seconds=timelineSeconds(z[0]),thumbIndex=Math.min(index,3),thumb=`https://i.ytimg.com/vi/${x.id}/${thumbIndex}.jpg`;return `<div class="moment" data-seconds="${seconds}" data-sort-seconds="${seconds}"><time>${z[0]}</time><div class="frame-shot"><img src="${thumb}" alt="${x.t} ${z[0]} 画面" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${x.id}/hqdefault.jpg'"><span class="frame-play">▶</span></div><p>${z[1]}</p></div>`}).join('');
  const timeline=document.getElementById('timeline');
  timeline.innerHTML=describedFrames+extraFramesFor(x);
  [...timeline.children].sort((a,b)=>Number(a.dataset.sortSeconds||0)-Number(b.dataset.sortSeconds||0)).forEach(node=>timeline.appendChild(node));
  document.querySelectorAll('#timeline .moment[data-seconds]').forEach(node=>node.onclick=()=>{document.querySelectorAll('#timeline .moment').forEach(n=>n.classList.remove('selected'));node.classList.add('selected');seekTimeline(Number(node.dataset.seconds))});
  document.querySelector('#timeline .moment[data-seconds]')?.classList.add('selected');
  paintStoryboardFrames();
  document.getElementById('flow').innerHTML=`<div class="flow-head"><b>用户心流体验</b><span>从观看者视角判断留存动力</span></div><div class="flow-grid"><div class="flow-step"><label>01 · 注意力</label><p>${f.a}</p></div><div class="flow-step"><label>02 · 情绪</label><p>${f.b}</p></div><div class="flow-step"><label>03 · 信息差</label><p>${f.c}</p></div><div class="flow-step"><label>04 · 留存问题</label><p>${f.d}</p></div></div>`;
  document.getElementById('mCta').textContent=x.u;
  document.getElementById('modal').classList.add('show')
}
 document.getElementById('close').onclick=()=>{document.getElementById('modal').classList.remove('show');document.getElementById('mPlayer').innerHTML=''};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal'){e.currentTarget.classList.remove('show');document.getElementById('mPlayer').innerHTML=''}};document.getElementById('grid').onclick=e=>{const card=e.target.closest('.card');if(!card||e.target.closest('.watch'))return;const button=card.querySelector('.watch');if(button)open(Number(button.dataset.i))};

/* Weekly feed: GitHub Actions updates data/weekly.json; the built-in samples remain the fallback. */
function escapeFeedText(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function cleanFeedText(value){return String(value??'').replace(/<[^>]*>/g,' ').replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim()}
function normalizeWeeklyVideo(raw){
  const id=String(raw?.id||'').trim();if(!id)return null;
  const title=cleanFeedText(raw.t||raw.title||id).slice(0,180);
  const hook=cleanFeedText(raw.h||raw.hook||raw.description||title).slice(0,150);
  const ten=cleanFeedText(raw.ten||raw.first10||'').slice(0,220);
  const story=cleanFeedText(raw.story||raw.synopsis||'').slice(0,220);
  const hookZh=cleanFeedText(raw.hZh||raw.hookZh||'').slice(0,220);
  const tags=Array.isArray(raw.g)?raw.g:[];
  const moments=Array.isArray(raw.m)?raw.m.map(z=>[cleanFeedText(z?.[0]||''),cleanFeedText(z?.[1]||'')]).filter(z=>z[0]&&z[1]):[];
  return {id,t:title,c:cleanFeedText(raw.c||raw.channel||'YouTube 官方账号'),d:Number(raw.d)||0,s:Math.max(72,Math.min(96,Number(raw.s)||80)),g:tags.map(x=>cleanFeedText(x)).filter(Boolean).slice(0,3),h:hook,hZh:hookZh,ten,story,u:cleanFeedText(raw.u||'先验证前 180 秒的身份、羞辱或反击节点，再决定是否拆成买量素材。'),m:moments.length?moments:null,v:Number(raw.v)||0,p:raw.p||'',source:raw.source||'weekly-feed'}
}
async function loadWeeklyFeed(){
  try{
    const response=await fetch(`data/weekly.json?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const payload=await response.json();const incoming=Array.isArray(payload.videos)?payload.videos.map(normalizeWeeklyVideo).filter(Boolean):[];const byId=new Map(data.map(item=>[item.id,item]));
    incoming.forEach(item=>{const existing=byId.get(item.id);if(existing){if(item.v)existing.v=item.v;if(item.p)existing.p=item.p;if(item.d)existing.d=item.d;if(item.ten)existing.ten=item.ten;if(item.hZh)existing.hZh=item.hZh;if(item.story)existing.story=item.story}else{data.push(item);byId.set(item.id,item)}});
    retainSampleLimit();
    data.forEach(item=>{Object.assign(item,statsById[item.id]||{});item.gender=inferGender(item)});
    weeklyFeedUpdatedAt=payload.generatedAt||'';render();
  }catch(error){console.info('Weekly feed unavailable; using built-in samples.',error)}
}
loadWeeklyFeed();
