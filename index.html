const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};const isNewThisWeek=x=>{if(!x.p)return false;const start=weekStart(new Date),end=new Date(start);end.setDate(start.getDate()+7);const published=new Date(x.p);return published>=start&&published<end};const storyFor=x=>{const g=x.g.join('');const tail=g.includes('末日')?'当资源和信任同时耗尽，主角必须在暴露底牌前找到盟友。':g.includes('豪门')?'身份与利益交错，主角在公开场合迎来第一次翻盘。':g.includes('亲情')?'亲情真相逐步浮出水面，任何一次选择都可能留下无法挽回的遗憾。':g.includes('校园')?'秘密关系在日常场景中不断升温，越想隐藏越容易被发现。':'误会与反击交替推进，新的线索把冲突带向更大的局面。';return `${x.h} ${tail}`};const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;const fmtViews=n=>!n?'播放量待抓取':n>=1e8?`${(n/1e8).toFixed(1)}亿`:n>=1e4?`${(n/1e4).toFixed(1)}万`:n.toLocaleString('zh-CN');const fmtDate=v=>v?new Date(v).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):'时间待抓取';const genderLabel=g=>g==='female'?'女频':g==='male'?'男频':'中性待判';let active='all',currentSrc='';
const femaleWords=/\b(she|her|wife|mom|mother|girl|queen|bride|fianc(?:e|é)e|nanny)\b|她|女|妻|母|新娘|王后/gi;const maleWords=/\b(he|his|husband|king|prince|man|hero|boy|brother|father|system|apocalypse|superhero|rival)\b|他|男|夫|父|王子|英雄|兄弟/gi;function inferGender(x){if(leadOverrides[x.id])return leadOverrides[x.id];const text=[x.t,x.h,...x.g].join(' '),f=(text.match(femaleWords)||[]).length,m=(text.match(maleWords)||[]).length;return f-m>=2?'female':m-f>=2?'male':'neutral'}data.forEach(x=>{Object.assign(x,statsById[x.id]||{});x.gender=inferGender(x)});

function socialMatches(x,q,platform,duration,kind){const chipOk=active==='all'||x.g.includes(active)||(active==='挑战'&&x.kind==='challenge')||(active==='评论'&&([x.t,x.h,x.u].join('').includes('评论')||x.g.some(function(t){return t.includes('评论')||t.includes('讨论')})))||(active==='审美'&&(x.platform==='Instagram'||x.g.some(function(t){return t.includes('审美')||t.includes('情绪')})));return(!q||[x.t,x.platform].concat(x.g,x.h).join('').toLowerCase().includes(q))&&(platform==='all'||x.platform===platform)&&(kind==='all'||x.kind===kind)&&(duration==='all'||duration==='short'&&x.d<=60||duration==='long'&&x.d>60&&x.d<=600||duration==='xl'&&x.d>600)&&chipOk}
function socialCard(x){const i=socialData.indexOf(x);const tags=x.g.map(function(t,j){return '<span class="tag '+(j===0?'hot':j===1?'gold':'')+'">'+t+'</span>'}).join('');const kind=x.kind==='challenge'?'挑战':x.kind==='creator'?'创作者':x.kind==='story'?'叙事':'事件';return '<article class="card" data-social-index="'+i+'"><div class="cover" style="background-image:linear-gradient(180deg,transparent 38%,#060a14d9),url(\''+x.cover+'\');background-size:cover;background-position:center"><span class="time">'+fmt(x.d)+'</span></div><div class="body"><h3 class="card-title">'+x.t+'</h3><div class="meta"><span>'+fmtViews(x.v)+' 播放</span><span class="dot"></span><span>'+fmtDate(x.p)+' 发布</span><span class="dot"></span><span>'+x.platform+'</span></div><div class="tags">'+tags+'<span class="tag neutral">'+kind+'</span></div><div class="hook">'+x.h+'</div><div class="synopsis"><b>热点梗概</b><p>'+x.h+' '+x.u+'</p></div><div class="foot"><button class="watch" data-social-i="'+i+'">▶ 页内播放</button><span class="score">传播 '+Math.min(99,Math.round(x.v/100000))+'</span></div></div></article>'}
function renderSocial(){const q=(document.getElementById('q')?.value||'').toLowerCase(),platform=document.getElementById('channel')?.value||'all',duration=document.getElementById('duration')?.value||'all',kind=document.getElementById('gender')?.value||'all',sort=document.getElementById('sort')?.value||'views';let arr=socialData.filter(function(x){return socialMatches(x,q,platform,duration,kind)});if(sort==='views')arr.sort(function(a,b){return b.v-a.v});else if(sort==='latest')arr.sort(function(a,b){return new Date(b.p)-new Date(a.p)});else if(sort==='shortest')arr.sort(function(a,b){return a.d-b.d});else if(sort==='longest')arr.sort(function(a,b){return b.d-a.d});const sortLabel={views:'按播放量排序',latest:'按发布时间排序',shortest:'按时长从短到长',longest:'按时长从长到短'}[sort]||'按播放量排序';setText('count','显示 '+arr.length+' 条 · '+sortLabel);document.getElementById('grid').innerHTML=arr.length?arr.map(socialCard).join(''):'<div class="empty">没有匹配结果，试试切换平台或热点类型。</div>';bindFeedGrid()}
function socialVideoId(x){const index=socialData.indexOf(x);return x.videoId||baseDramaData[index%baseDramaData.length].id}
function socialPlayer(x){const videoId=socialVideoId(x);return '<iframe src="https://www.youtube-nocookie.com/embed/'+videoId+'?autoplay=1&rel=0&playsinline=1" title="热点视频预览" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'}
function openSocial(i){const x=socialData[i];if(!x)return;setText('mTitle',x.t);document.getElementById('mPlayer').innerHTML=socialPlayer(x);document.getElementById('mCover').innerHTML='<img src="'+x.cover+'" alt="'+x.t+' 封面"><b>'+x.t+'</b>';document.getElementById('mMeta').innerHTML='<span>'+x.platform+'</span><span class="dot"></span><span>'+fmtViews(x.v)+' 播放</span><span class="dot"></span><span>页内直接播放</span><span class="dot"></span><a href="'+x.sourceUrl+'" target="_blank" rel="noopener" style="color:var(--blue)">打开来源 ↗</a>';document.getElementById('timeline').innerHTML=x.m.map(function(z){return '<div class="moment"><time>'+z[0]+'</time><p>'+z[1]+'</p></div>'}).join('');document.getElementById('flow').innerHTML='<div class="flow-head"><b>用户心流体验</b><span>从观看者视角判断传播动力</span></div><div class="flow-grid"><div class="flow-step"><label>01 · 注意力</label><p>第一秒给出结果或冲突</p></div><div class="flow-step"><label>02 · 情绪</label><p>好奇 → 参与 → 分享</p></div><div class="flow-step"><label>03 · 信息差</label><p>评论区会如何继续改写？</p></div><div class="flow-step"><label>04 · 留存问题</label><p>下一条内容还能否接住热度？</p></div></div>';setText('mCta',x.u);document.getElementById('modal').classList.add('show')}
function bindFeedGrid(){const grid=document.getElementById('grid');if(!grid)return;grid.onclick=function(e){const card=e.target.closest('.card');if(!card)return;if(e.target.closest('.watch')){const b=e.target.closest('.watch');if(feedMode==='social'&&b.dataset.socialI!=null){e.stopPropagation();openSocial(Number(b.dataset.socialI))}return}if(feedMode==='social')openSocial(Number(card.dataset.socialIndex));else{const b=card.querySelector('.watch');if(b)open(Number(b.dataset.i))}}}
function switchFeed(mode){feedMode=mode==='social'?'social':'drama';document.querySelectorAll('.nav [data-feed]').forEach(function(b){b.classList.toggle('active',b.dataset.feed===feedMode)});document.getElementById('modal').classList.remove('show');document.getElementById('mPlayer').innerHTML='';configureFeedControls(feedMode);updateFeedChrome(feedMode);if(feedMode==='social')renderSocial();else render();bindFeedGrid()}
document.querySelectorAll('.nav [data-feed]').forEach(function(b){b.onclick=function(){switchFeed(b.dataset.feed)}})
;['q','channel','duration','sort','gender'].forEach(function(id){const el=document.getElementById(id);if(el)el.oninput=el.onchange=function(){feedMode==='social'?renderSocial():render()}})
document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});b.classList.add('on');active=b.dataset.tag;feedMode==='social'?renderSocial():render()}})
configureFeedControls('drama');updateFeedChrome('drama');render();bindFeedGrid();
</script>
</body>
</html>
