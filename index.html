function render(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('channel').value,d=document.getElementById('duration').value,sort=document.getElementById('sort').value,gender=document.getElementById('gender').value;let arr=data.filter(x=>(!q||[x.t,x.c,...x.g,x.h].join('').toLowerCase().includes(q))&&(c==='all'||x.c===c)&&(active==='all'||x.g.includes(active))&&(d==='all'||d==='short'&&x.d<=900||d==='long'&&x.d>900&&x.d<=1800||d==='xl'&&x.d>1800)&&(gender==='all'||x.gender===gender));if(sort==='views')arr.sort((a,b)=>(b.v||0)-(a.v||0));else if(sort==='latest')arr.sort((a,b)=>new Date(b.p||0)-new Date(a.p||0));else if(sort==='shortest')arr.sort((a,b)=>a.d-b.d);else if(sort==='longest')arr.sort((a,b)=>b.d-a.d);const sortLabel={views:'按播放量排序',latest:'按发布时间排序',shortest:'按时长从短到长',longest:'按时长从长到短'}[sort]||'按播放量排序';const weeklyCount=data.filter(isNewThisWeek).length;document.getElementById('count').textContent=`显示 ${arr.length} 条 · ${sortLabel} · 本周新增 ${weeklyCount} 条`;const status=document.getElementById('statusText');if(status)status.textContent=`本周新增 ${weeklyCount} 条 · 每周自动刷新`;const navCount=document.getElementById('navCount');if(navCount)navCount.textContent=data.length;document.getElementById('grid').innerHTML=arr.length?arr.map(x=>{const isNew=isNewThisWeek(x);return `<article class='card${isNew?' new-week':''}'><div class='body'>${isNew?`<span class='new-badge'>本周新增</span>`:''}<h3 class='card-title'>${x.t}</h3><div class='meta'><span>${fmtViews(x.v)} 播放</span><span class='dot'></span><span>${fmtDate(x.p)} 发布</span><span class='dot'></span><span>${x.c}</span></div><div class='tags'>${x.g.map((t,j)=>`<span class='tag ${j===0?'hot':j===1?'gold':''}'>${t}</span>`).join('')}<span class='tag ${x.gender}'>${genderLabel(x.gender)}</span></div><div class='hook'>${x.h}</div><div class='synopsis'><b>故事梗概</b><p>${storyFor(x)}</p></div><div class='foot'><button class='watch' data-i='${data.indexOf(x)}'>▶ 在页内观看</button><span class='score'>Hook ${x.s}</span></div></div></article>`}).join(''):`<div class='empty'>没有匹配结果，试试“反转”或切换筛选条件。</div>`;document.querySelectorAll('.watch').forEach(b=>b.onclick=e=>{e.stopPropagation();open(+b.dataset.i)})}
document.getElementById('q').oninput=render;document.getElementById('channel').onchange=render;document.getElementById('duration').onchange=render;document.getElementById('sort').onchange=render;document.getElementById('gender').onchange=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');active=b.dataset.tag;render()});render();
</script>
